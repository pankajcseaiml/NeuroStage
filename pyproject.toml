[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostage"
version = "0.1.0"
description = "Lightweight CNN-Transformer Framework for Real-Time EEG-Based Sleep Stage Classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "mne>=1.12.1",
    "h5py>=3.16.0",
    "scikit-learn>=1.7.2",
    "mlflow>=3.17.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "rich>=15.0.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "psycopg2-binary>=2.9.13",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "pydantic-settings>=2.15.0",
    "aiofiles>=25.1.0",
    "email-validator>=2.3.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.17.0",
    "black>=26.10.1",
    "mypy>=2.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N812", "N806", "E402"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["neurostage*", "backend*"]
