services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: neurostage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurostage
      POSTGRES_PASSWORD: neurostage
      POSTGRES_DB: neurostage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurostage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for Celery, optional) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neurostage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MLflow Tracking Server ────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: neurostage_mlflow
    restart: unless-stopped
    command: >
      bash -c "pip install mlflow psycopg2-binary -q &&
               mlflow server
               --backend-store-uri postgresql://neurostage:neurostage@postgres:5432/mlflow
               --default-artifact-root /mlflow/artifacts
               --host 0.0.0.0
               --port 5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000

  # ─── FastAPI Backend ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: neurostage_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./configs:/app/configs
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://neurostage:neurostage@postgres:5432/neurostage
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_CHECKPOINT: runs/checkpoints/neurostage_base_best.pt
      MODEL_CONFIG_PATH: configs/base.yaml
      SECRET_KEY: ${SECRET_KEY:-changeme_in_production}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Next.js Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurostage_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  mlflow_artifacts:
