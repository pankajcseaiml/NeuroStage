name: ✨ Feature Request
description: Suggest an enhancement or new feature for NeuroStage.
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea for NeuroStage!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or capability you would like to see.
      placeholder: A clear description of how the feature should work...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
      placeholder: Other approaches...

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ML Models & Compression
        - Data Preprocessing Pipeline
        - FastAPI Backend & Database
        - Next.js Dashboard UI
        - Docker & Deployment
        - Documentation & Examples
    validations:
      required: true
