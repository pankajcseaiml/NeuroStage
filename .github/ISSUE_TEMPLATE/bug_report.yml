name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in NeuroStage.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do NOT report security vulnerabilities here.
        Instead, refer to our [Security Policy](../../SECURITY.md) for confidential disclosure.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run 'python train.py ...'
        2. Set config ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Expected behavior...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: OS, Python version, PyTorch version, CUDA version, etc.
      value: |
        - OS: [e.g., Ubuntu 22.04 / Windows 11]
        - Python Version: [e.g., 3.11]
        - PyTorch Version: [e.g., 2.2.0]
        - Hardware: [e.g., NVIDIA RTX 3080 / CPU only]
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified that this issue does not expose any credentials or private datasets.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
